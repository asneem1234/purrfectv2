<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Cute gradient backgrounds -->
    <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE4EC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC0CB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lavenderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DDA0DD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mintGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#98D8AA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="peachGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFECD2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCB69F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F7FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#89CFF0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#FFB6C1" flood-opacity="0.4"/>
    </filter>
    
    <!-- Sparkle filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="#FFF5F8"/>
  
  <!-- Decorative paw prints -->
  <g fill="#FFD1DC" opacity="0.3">
    <circle cx="50" cy="50" r="12"/>
    <circle cx="35" cy="35" r="6"/>
    <circle cx="65" cy="35" r="6"/>
    <circle cx="30" cy="55" r="5"/>
    <circle cx="70" cy="55" r="5"/>
  </g>
  <g fill="#FFD1DC" opacity="0.3" transform="translate(1100, 800)">
    <circle cx="0" cy="0" r="12"/>
    <circle cx="-15" cy="-15" r="6"/>
    <circle cx="15" cy="-15" r="6"/>
    <circle cx="-20" cy="5" r="5"/>
    <circle cx="20" cy="5" r="5"/>
  </g>
  <g fill="#FFD1DC" opacity="0.2" transform="translate(1050, 100)">
    <circle cx="0" cy="0" r="10"/>
    <circle cx="-12" cy="-12" r="5"/>
    <circle cx="12" cy="-12" r="5"/>
    <circle cx="-15" cy="4" r="4"/>
    <circle cx="15" cy="4" r="4"/>
  </g>
  
  <!-- Title -->
  <g transform="translate(600, 45)">
    <rect x="-200" y="-20" width="400" height="55" rx="27" fill="url(#pinkGradient)" filter="url(#shadow)"/>
    <text x="0" y="18" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="26" fill="#D63384" font-weight="bold">✨ Purrfect AI System Architecture ✨</text>
  </g>

  <!-- ============ USER SECTION ============ -->
  <g transform="translate(120, 200)">
    <!-- User circle with icon -->
    <circle cx="0" cy="0" r="50" fill="url(#pinkGradient)" filter="url(#shadow)"/>
    <circle cx="0" cy="-12" r="18" fill="#D63384"/>
    <ellipse cx="0" cy="20" rx="28" ry="18" fill="#D63384"/>
    <circle cx="0" cy="-12" r="14" fill="#FFE4EC"/>
    <ellipse cx="0" cy="20" rx="24" ry="14" fill="#FFE4EC"/>
    <text x="0" y="75" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="15" fill="#D63384" font-weight="bold">Student</text>
  </g>

  <!-- ============ AUTH BOX ============ -->
  <g transform="translate(120, 350)">
    <rect x="-70" y="-35" width="140" height="70" rx="18" fill="url(#lavenderGradient)" filter="url(#shadow)"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="14" fill="#6B4C7A" font-weight="bold">🔐 Login</text>
    <text x="0" y="12" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="11" fill="#888">Flask-Login</text>
  </g>

  <!-- ============ MAIN APP (Flask) ============ -->
  <g transform="translate(350, 350)">
    <rect x="-85" y="-55" width="170" height="110" rx="22" fill="url(#peachGradient)" filter="url(#shadow)"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="18" fill="#C4563A" font-weight="bold">🌸 Flask App</text>
    <text x="0" y="5" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="11" fill="#666">app1.py</text>
    <text x="0" y="22" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="10" fill="#888">Blueprint Router</text>
    <text x="0" y="38" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="10" fill="#888">CSRF Protection</text>
  </g>

  <!-- ============ 6 FEATURES ============ -->
  
  <!-- Pawfessor Meowkins -->
  <g transform="translate(600, 130)">
    <rect x="-80" y="-28" width="160" height="56" rx="14" fill="url(#pinkGradient)" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="13" fill="#D63384" font-weight="bold">📚 Pawfessor Meowkins</text>
    <text x="0" y="15" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="10" fill="#888">AI Tutor • Teach Me</text>
  </g>

  <!-- Generate Study Plan -->
  <g transform="translate(600, 210)">
    <rect x="-80" y="-28" width="160" height="56" rx="14" fill="url(#mintGradient)" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="13" fill="#2E8B57" font-weight="bold">📅 Generate Study Plan</text>
    <text x="0" y="15" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="10" fill="#888">Personalized • Focus</text>
  </g>

  <!-- Generate Flashcards -->
  <g transform="translate(600, 290)">
    <rect x="-80" y="-28" width="160" height="56" rx="14" fill="url(#lavenderGradient)" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="13" fill="#6B4C7A" font-weight="bold">📂 Generate Flashcards</text>
    <text x="0" y="15" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="10" fill="#888">Upload PDFs • Quick</text>
  </g>

  <!-- Mind Games -->
  <g transform="translate(600, 370)">
    <rect x="-80" y="-28" width="160" height="56" rx="14" fill="url(#peachGradient)" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="13" fill="#C4563A" font-weight="bold">🎮 Mind Games</text>
    <text x="0" y="15" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="10" fill="#888">Puzzles • Cognitive</text>
  </g>

  <!-- Study Rooms -->
  <g transform="translate(600, 450)">
    <rect x="-80" y="-28" width="160" height="56" rx="14" fill="url(#skyGradient)" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="13" fill="#4682B4" font-weight="bold">👥 Study Rooms</text>
    <text x="0" y="15" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="10" fill="#888">Virtual • Real-time</text>
  </g>

  <!-- Clawdia -->
  <g transform="translate(600, 530)">
    <rect x="-80" y="-28" width="160" height="56" rx="14" fill="url(#pinkGradient)" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="13" fill="#D63384" font-weight="bold">🎀 Clawdia</text>
    <text x="0" y="15" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="10" fill="#888">Exam Analysis • OCR</text>
  </g>

  <!-- ============ AI SERVICES ============ -->
  <g transform="translate(850, 200)">
    <rect x="-75" y="-55" width="150" height="110" rx="18" fill="url(#pinkGradient)" filter="url(#shadow)"/>
    <text x="0" y="-25" text-anchor="middle" font-size="24">🧠</text>
    <text x="0" y="0" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="14" fill="#D63384" font-weight="bold">Gemini AI</text>
    <text x="0" y="18" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="10" fill="#888">gemini-2.0-flash</text>
    <text x="0" y="35" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="10" fill="#888">ReAct Framework</text>
  </g>

  <!-- ============ RAG VECTOR DB - CYLINDER ============ -->
  <g transform="translate(850, 420)">
    <!-- Cylinder body -->
    <ellipse cx="0" cy="-55" rx="75" ry="20" fill="#B8E6C1"/>
    <rect x="-75" y="-55" width="150" height="110" fill="url(#mintGradient)"/>
    <ellipse cx="0" cy="55" rx="75" ry="20" fill="url(#mintGradient)" filter="url(#shadow)"/>
    <ellipse cx="0" cy="-55" rx="75" ry="20" fill="#E0F5E9" stroke="#98D8AA" stroke-width="2"/>
    <!-- Vector dots inside cylinder -->
    <circle cx="-35" cy="-25" r="5" fill="#2E8B57" opacity="0.5"/>
    <circle cx="15" cy="-15" r="4" fill="#2E8B57" opacity="0.4"/>
    <circle cx="-20" cy="5" r="6" fill="#2E8B57" opacity="0.6"/>
    <circle cx="30" cy="-5" r="4" fill="#2E8B57" opacity="0.5"/>
    <circle cx="-8" cy="25" r="5" fill="#2E8B57" opacity="0.4"/>
    <circle cx="35" cy="30" r="4" fill="#2E8B57" opacity="0.5"/>
    <circle cx="-30" cy="35" r="5" fill="#2E8B57" opacity="0.6"/>
    <circle cx="18" cy="40" r="4" fill="#2E8B57" opacity="0.4"/>
    <!-- Label -->
    <text x="0" y="90" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="14" fill="#2E8B57" font-weight="bold">🔍 Qdrant Vector DB</text>
    <text x="0" y="108" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="10" fill="#888">RAG • Embeddings</text>
    <text x="0" y="123" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="9" fill="#aaa">Study Plans + Docs</text>
  </g>

  <!-- ============ POSTGRESQL DATABASE - CYLINDER ============ -->
  <g transform="translate(1060, 320)">
    <!-- Cylinder body -->
    <ellipse cx="0" cy="-50" rx="65" ry="18" fill="#D8C8E8"/>
    <rect x="-65" y="-50" width="130" height="100" fill="url(#lavenderGradient)"/>
    <ellipse cx="0" cy="50" rx="65" ry="18" fill="url(#lavenderGradient)" filter="url(#shadow)"/>
    <ellipse cx="0" cy="-50" rx="65" ry="18" fill="#E8D5F2" stroke="#DDA0DD" stroke-width="2"/>
    <!-- Table lines inside -->
    <line x1="-45" y1="-25" x2="45" y2="-25" stroke="#6B4C7A" stroke-width="1" opacity="0.3"/>
    <line x1="-45" y1="0" x2="45" y2="0" stroke="#6B4C7A" stroke-width="1" opacity="0.3"/>
    <line x1="-45" y1="25" x2="45" y2="25" stroke="#6B4C7A" stroke-width="1" opacity="0.3"/>
    <!-- Label -->
    <text x="0" y="85" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="14" fill="#6B4C7A" font-weight="bold">💾 PostgreSQL</text>
    <text x="0" y="103" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="10" fill="#888">Supabase • Users</text>
  </g>

  <!-- ============ SOCKET.IO ============ -->
  <g transform="translate(350, 530)">
    <rect x="-65" y="-30" width="130" height="60" rx="15" fill="url(#skyGradient)" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="13" fill="#4682B4" font-weight="bold">⚡ Socket.IO</text>
    <text x="0" y="15" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="10" fill="#888">Real-time Events</text>
  </g>

  <!-- ============ FILE PROCESSING ============ -->
  <g transform="translate(350, 660)">
    <rect x="-75" y="-35" width="150" height="70" rx="15" fill="url(#peachGradient)" filter="url(#shadow)"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="13" fill="#C4563A" font-weight="bold">📄 File Processing</text>
    <text x="0" y="8" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="10" fill="#888">PyPDF2 • EasyOCR</text>
    <text x="0" y="23" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="9" fill="#aaa">PDFs • Images</text>
  </g>

  <!-- ============ ARROWS & CONNECTIONS ============ -->
  <!-- User to Auth -->
  <path d="M120,260 L120,305" stroke="#FF69B4" stroke-width="3" fill="none"/>
  <polygon points="120,315 115,305 125,305" fill="#FF69B4"/>
  
  <!-- Auth to Flask -->
  <path d="M195,350 L255,350" stroke="#DDA0DD" stroke-width="3" fill="none"/>
  <polygon points="265,350 255,345 255,355" fill="#DDA0DD"/>
  
  <!-- Flask to Features -->
  <path d="M435,310 Q500,130 520,130" stroke="#FF69B4" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <path d="M435,320 Q490,210 520,210" stroke="#98D8AA" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <path d="M435,340 L520,290" stroke="#DDA0DD" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <path d="M435,350 L520,370" stroke="#FCB69F" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <path d="M435,370 Q490,450 520,450" stroke="#89CFF0" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <path d="M435,390 Q490,530 520,530" stroke="#FF69B4" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  
  <!-- Features to AI -->
  <path d="M680,130 L770,170" stroke="#FF69B4" stroke-width="2" fill="none"/>
  <path d="M680,290 L770,240" stroke="#DDA0DD" stroke-width="2" fill="none"/>
  
  <!-- Features to RAG Vector DB -->
  <path d="M680,210 Q750,320 775,365" stroke="#2E8B57" stroke-width="3" fill="none"/>
  <path d="M680,290 L775,385" stroke="#DDA0DD" stroke-width="2" fill="none"/>
  <path d="M680,530 Q750,490 775,450" stroke="#FF69B4" stroke-width="2" fill="none"/>
  
  <!-- Study Plan to RAG (special thick line) -->
  <path d="M680,210 Q760,330 775,370" stroke="#2E8B57" stroke-width="4" fill="none" stroke-dasharray="8,4"/>
  
  <!-- AI to PostgreSQL -->
  <path d="M925,200 Q990,260 995,280" stroke="#FF69B4" stroke-width="2" fill="none"/>
  
  <!-- RAG to PostgreSQL -->
  <path d="M925,400 Q980,360 995,350" stroke="#98D8AA" stroke-width="2" fill="none"/>
  
  <!-- Flask to Socket.IO -->
  <path d="M350,405 L350,490" stroke="#89CFF0" stroke-width="2" fill="none"/>
  <polygon points="350,500 345,490 355,490" fill="#89CFF0"/>
  
  <!-- Study Rooms to Socket.IO -->
  <path d="M520,450 Q440,480 415,500" stroke="#89CFF0" stroke-width="2" fill="none"/>
  
  <!-- Flask to File Processing -->
  <path d="M300,405 Q280,560 300,620" stroke="#FCB69F" stroke-width="2" fill="none"/>

  <!-- ============ CUTE DECORATIONS ============ -->
  <!-- Hearts -->
  <g fill="#FF69B4" opacity="0.5">
    <path transform="translate(70,720) scale(0.6)" d="M0,0 c0,-8 -12,-15 -12,-8 c0,10 12,18 12,18 c0,0 12,-8 12,-18 c0,-7 -12,0 -12,8"/>
  </g>
  <g fill="#FFB6C1" opacity="0.4" transform="translate(1120, 120)">
    <path d="M0,0 c0,-6 -9,-11 -9,-6 c0,8 9,14 9,14 c0,0 9,-6 9,-14 c0,-5 -9,0 -9,6" transform="scale(0.5)"/>
  </g>
  
  <!-- Stars -->
  <g fill="#FFD700" filter="url(#glow)" transform="translate(150,100)">
    <polygon points="0,-8 2,0 10,0 4,4 6,12 0,7 -6,12 -4,4 -10,0 -2,0" transform="scale(0.5)"/>
  </g>
  <g fill="#FFD700" filter="url(#glow)" transform="translate(1000, 80)">
    <polygon points="0,-8 2,0 10,0 4,4 6,12 0,7 -6,12 -4,4 -10,0 -2,0" transform="scale(0.4)"/>
  </g>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(70, 760)">
    <rect x="-15" y="-12" width="350" height="95" rx="12" fill="white" stroke="#FFB6C1" stroke-width="2" opacity="0.95"/>
    <text x="0" y="8" font-family="Comic Sans MS, cursive" font-size="13" fill="#D63384" font-weight="bold">✨ Legend</text>
    
    <rect x="0" y="22" width="18" height="10" rx="3" fill="url(#pinkGradient)"/>
    <text x="25" y="31" font-family="Comic Sans MS, cursive" font-size="10" fill="#666">AI Features</text>
    
    <rect x="110" y="22" width="18" height="10" rx="3" fill="url(#mintGradient)"/>
    <text x="135" y="31" font-family="Comic Sans MS, cursive" font-size="10" fill="#666">Vector DB/RAG</text>
    
    <rect x="230" y="22" width="18" height="10" rx="3" fill="url(#lavenderGradient)"/>
    <text x="255" y="31" font-family="Comic Sans MS, cursive" font-size="10" fill="#666">SQL DB</text>
    
    <rect x="0" y="45" width="18" height="10" rx="3" fill="url(#skyGradient)"/>
    <text x="25" y="54" font-family="Comic Sans MS, cursive" font-size="10" fill="#666">Real-time</text>
    
    <rect x="110" y="45" width="18" height="10" rx="3" fill="url(#peachGradient)"/>
    <text x="135" y="54" font-family="Comic Sans MS, cursive" font-size="10" fill="#666">Core/Processing</text>
    
    <path d="M230,50 L260,50" stroke="#2E8B57" stroke-width="3" stroke-dasharray="5,3"/>
    <text x="268" y="54" font-family="Comic Sans MS, cursive" font-size="10" fill="#666">RAG Store</text>
  </g>

  <!-- Flow description -->
  <g transform="translate(500, 760)">
    <rect x="-15" y="-12" width="660" height="95" rx="12" fill="white" stroke="#FFB6C1" stroke-width="2" opacity="0.95"/>
    <text x="0" y="8" font-family="Comic Sans MS, cursive" font-size="13" fill="#D63384" font-weight="bold">🐾 User Flow</text>
    <text x="0" y="30" font-family="Comic Sans MS, cursive" font-size="11" fill="#666">
      <tspan fill="#FF69B4">① Student Login</tspan> → <tspan fill="#DDA0DD">② Auth</tspan> → <tspan fill="#FCB69F">③ Flask Router</tspan> → <tspan fill="#D63384">④ Choose Feature</tspan>
    </text>
    <text x="0" y="50" font-family="Comic Sans MS, cursive" font-size="11" fill="#666">
      → <tspan fill="#FF69B4">⑤ AI Processing</tspan> → <tspan fill="#2E8B57">⑥ RAG Context (Vector Search)</tspan> → <tspan fill="#6B4C7A">⑦ Store/Retrieve</tspan>
    </text>
    <text x="0" y="72" font-family="Comic Sans MS, cursive" font-size="10" fill="#aaa">Study Plans stored in Qdrant Vector DB for semantic search &amp; personalization</text>
  </g>

  <!-- ============ FLOW NUMBERS ============ -->
  <g font-family="Comic Sans MS, cursive" font-size="12" font-weight="bold">
    <circle cx="120" cy="230" r="11" fill="#FF69B4"/>
    <text x="120" y="234" text-anchor="middle" fill="white">1</text>
    
    <circle cx="155" cy="350" r="11" fill="#DDA0DD"/>
    <text x="155" y="354" text-anchor="middle" fill="white">2</text>
    
    <circle cx="390" cy="295" r="11" fill="#FCB69F"/>
    <text x="390" y="299" text-anchor="middle" fill="white">3</text>
    
    <circle cx="560" cy="330" r="11" fill="#D63384"/>
    <text x="560" y="334" text-anchor="middle" fill="white">4</text>
    
    <circle cx="810" cy="145" r="11" fill="#FF69B4"/>
    <text x="810" y="149" text-anchor="middle" fill="white">5</text>
    
    <circle cx="780" cy="340" r="11" fill="#2E8B57"/>
    <text x="780" y="344" text-anchor="middle" fill="white">6</text>
    
    <circle cx="1000" cy="360" r="11" fill="#6B4C7A"/>
    <text x="1000" y="364" text-anchor="middle" fill="white">7</text>
  </g>

</svg>