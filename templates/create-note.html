                const userDiv = document.createElement('div');
                userDiv.style.textAlign = 'right';
                userDiv.style.margin = '6px 0';
                userDiv.innerHTML = `<span style='background:#f3e6ef;color:#b983ff;padding:6px 12px;border-radius:10px 10px 2px 12px;display:inline-block;'>${topic || (pdfFile ? pdfFile.name : '')}</span>`;
                aiChatAreaGenerate.appendChild(userDiv);
                aiInputGenerate.value = '';
                aiPdfInput.value = '';
                // Show AI thinking
                const aiDiv = document.createElement('div');
                aiDiv.style.textAlign = 'left';
                aiDiv.style.margin = '6px 0';
                aiDiv.innerHTML = `<span style='background:#ffe4ef;color:#f472b6;padding:6px 12px;border-radius:12px 10px 10px 2px;display:inline-block;'>Thinking...</span>`;
                aiChatAreaGenerate.appendChild(aiDiv);
                aiChatAreaGenerate.scrollTop = aiChatAreaGenerate.scrollHeight;
                // Simulate AI response
                setTimeout(() => {
                    aiDiv.innerHTML = `<span style='background:#ffe4ef;color:#f472b6;padding:6px 12px;border-radius:12px 10px 10px 2px;display:inline-block;'>[AI would generate notes or summary here!]</span>`;
                    aiChatAreaGenerate.scrollTop = aiChatAreaGenerate.scrollHeight;
                }, 1200);
            });
            
            // Pan canvas by dragging background
            canvas.addEventListener('mousedown', function(e) {
                if (e.target === canvas) {
                    isPanning = true;
                    canvas.classList.add('panning');
                    panStart = {x: e.clientX, y: e.clientY};
                    scrollStart = {x: mainContent.scrollLeft, y: mainContent.scrollTop};
                }
            });
            document.addEventListener('mousemove', function(e) {
                if (isPanning) {
                    const dx = e.clientX - panStart.x;
                    const dy = e.clientY - panStart.y;
                    mainContent.scrollLeft = scrollStart.x - dx;
                    mainContent.scrollTop = scrollStart.y - dy;
                }
            });
            document.addEventListener('mouseup', function() {
                if (isPanning) {
                    isPanning = false;
                    canvas.classList.remove('panning');
                }
            });
            // Center canvas on load
            setTimeout(() => {
                // Ensure canvas is properly centered
                mainContent.scrollLeft = (canvas.offsetWidth - mainContent.offsetWidth) / 2;
                mainContent.scrollTop = (canvas.offsetHeight - mainContent.offsetHeight) / 2;
                
                // Add a more prominent title since we removed the sidebar
                const pageTitle = document.querySelector('.page-title');
                if (pageTitle) {
                    pageTitle.style.fontSize = '2em';
                    pageTitle.style.fontWeight = 'bold';
                    pageTitle.style.color = 'var(--accent)';
                    pageTitle.style.textAlign = 'center';
                    pageTitle.style.marginBottom = '20px';
                }
                
                // Define connectWithArrow function if it doesn't exist
                if (typeof connectWithArrow !== 'function') {
                    window.connectWithArrow = function(fromEl, toEl) {
                        if (typeof drawArrow === 'function') {
                            drawArrow(fromEl, toEl);
                        } else {
                            console.error("drawArrow function not found");
                        }
                    };
                }
                
                // Fix any issues with the original click handler for the add note button
                const addNoteBtnOriginal = document.getElementById('add-note');
                if (addNoteBtnOriginal) {
                    addNoteBtnOriginal.style.position = 'relative';
                    addNoteBtnOriginal.style.zIndex = '100';
                }
                
                // Make sure the add note button works
                console.log("Canvas loaded and ready for sticky notes");
                
                // We already have an event handler for the add note button,
                // so we don't need to add another one here.
                console.log("Note functionality is ready");
            }, 100);
        });
    </script>
</body>
</html>
