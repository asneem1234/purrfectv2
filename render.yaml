services:
  - type: web
    name: purrfect-study-buddy
    env: python
    pythonVersion: 3.9.18
    buildCommand: "chmod +x start.sh && pip install -r requirements.minimal.txt"
    startCommand: "./start.sh"
    autoDeploy: true
    envVars:
      - key: FLASK_APP
        value: app1.py
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: purrfect-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: SERVER_API_KEY
        generateValue: true

databases:
  - name: purrfect-db
    databaseName: purrfect
    user: purrfect_user
    plan: free
